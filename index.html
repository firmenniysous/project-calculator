<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div id="calculator">
        <div id="output"></div>
        <div id="buttons-sector">
            <button class="button number">1</button>
            <button class="button number">2</button>
            <button class="button number">3</button>
            <button class="button operator">+</button>
            <button class="button number">4</button>
            <button class="button number">5</button>
            <button class="button number">6</button>
            <button class="button operator" id="minus">-</button>
            <button class="button number">7</button>
            <button class="button number">8</button>
            <button class="button number">9</button>
            <button class="button operator" id="multiply">*</button>
            <button class="button" id="point">.</button>
            <button class="button number">0</button>
            <button class="button" id="equal">=</button>
            <button class="button operator">/</button>
            <button class="button" id="clear">C</button>
            <button class="button" id="clear-all">AC</button>
        </div>
    </div>
</body>
</html>
